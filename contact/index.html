<div class="contact-form-container">

  <!-- Success and Error message containers -->
  <div id="form-messages" class="form-messages"></div>

  <form id="contact-form" action="https://formspree.io/f/dattarajpai.k@gmail.com" method="POST">
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required placeholder="Enter your name">

    <label for="email">Your Email:</label>
    <input type="email" id="email" name="_replyto" required placeholder="Enter your email">

    <label for="message">Your Message:</label>
    <textarea id="message" name="message" required placeholder="Enter your message"></textarea>

    <button type="submit">Send Message</button>
  </form>
</div>

<script>
  document.getElementById("contact-form").addEventListener("submit", function(event) {
    event.preventDefault();  // Prevents the default form submission

    var form = event.target;
    var formData = new FormData(form);
    var formMessages = document.getElementById("form-messages");

    // Clear any previous messages
    formMessages.textContent = "";

    // Send form data to Formspree
    fetch(form.action, {
      method: "POST",
      body: formData
    })
    .then(response => {
      if (response.ok) {
        formMessages.textContent = "Thank you for your message! We’ll get back to you soon.";
        formMessages.style.color = "green";
        form.reset();  // Resets the form
      } else {
        formMessages.textContent = "Oops! Something went wrong. Please try again later.";
        formMessages.style.color = "red";
      }
    })
    .catch(error => {
      formMessages.textContent = "Oops! Something went wrong. Please try again later.";
      formMessages.style.color = "red";
    });
  });
</script>

<style>
  .contact-form-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    font-family: inherit;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  label {
    font-size: 16px;
    color: #444;
  }

  input, textarea {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }

  button {
    padding: 10px;
    background-color: #222;
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #111;
  }

  input, textarea, button {
    width: 100%;
  }

  /* Style for the success/error message */
  .form-messages {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
  }
</style>
