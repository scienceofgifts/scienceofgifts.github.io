{% assign i = include.index | plus: 0 %}
{% assign section = page.more_sections[i] %}

{% if section %}
<section class="more-section">
  <h2>{{ section.title }}</h2>
  <p class="more-subtext">{{ section.subtext }}</p>

  <div class="more-list">
    {% for item in section.items %}
    <div class="more-item">

      <a href="{{ item.link | default: '#' }}" class="more-link">

        <!-- IMAGE with fallback + alt -->
        <img 
          src="{{ item.img | default: '/assets/placeholder.webp' }}" 
          alt="{{ item.title | escape }}"
          loading="lazy"
          onerror="this.onerror=null;this.src='/assets/placeholder.webp';"
        >

        <div class="more-content">
          <h3>{{ item.title }}</h3>

          {% if item.price %}
          <p class="price">{{ item.price }}</p>
          {% endif %}
        </div>

        <span class="btn-r">SHOP</span>

      </a>

    </div>
    {% endfor %}
  </div>
</section>
{% endif %}

<style>
/* ITEM LAYOUT */
.more-item {
  padding: 16px 0;
  border-bottom: 1px dotted #ccc;
}

.more-item a {
  border-bottom: 0px dotted #ccc;
}

.more-item a:hover {
  background-color: white;
}

/* FULL CLICKABLE ROW */
.more-link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
}

/* IMAGE */
.more-link img {
  width: 75px;
  height: 75px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 6px;
  background: #f5f5f5;
  transition: opacity 0.2s ease;
  flex-shrink: 0;
}


/* HOVER IMAGE */
.more-link:hover img {
  opacity: 0.75;
}

/* TEXT */
.more-content {
  flex: 1;
  min-width: 0; /* prevents text overflow issues */
}

.more-content h3 {
  font-size: 15px;
  margin: 0 0 4px;
  line-height: 1.3;
}

.price {
  font-size: 14px;
  color: #666;
}

/* BUTTON FIX (IMPORTANT) */
.btn-r {
  flex-shrink: 0;
  padding: 12px 18px;
  font-size: 11px;
  letter-spacing: 1px;
  background-color: #eee;
  color: #3771c8;
  border-radius: 3px;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.25);
  font: bold 11px/17px 'Sen', sans-serif;

  /* REMOVE THESE PROBLEMS */
  width: auto;
  float: none;

  display: inline-block;
}

.btn-r:hover{
    background-color: #e9e9e9;
}

/* BUTTON HOVER */
.more-link:hover .btn {
  background-color: #2a7ae2;
}

/* DESKTOP */
@media (min-width: 768px) {
  .more-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .more-item {
    border: 1px solid #eee;
    padding: 12px;
  }

  .more-link {
    flex-direction: column;
    align-items: flex-start;
  }

  .more-link img {
    width: 100%;
    height: auto;
  }

  .btn-r {
    margin-top: 10px;
    width: 100%;
    text-align: center;
    padding: 10px 0px;
  }
}
</style>
