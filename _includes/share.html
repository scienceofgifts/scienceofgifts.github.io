<div class="share">
<ul class="share-buttons">
   <li class="tw">
        <a rel="nofollow" href="https://twitter.com/intent/tweet?text={{ page.title }}&amp;url={{ site.url }}{{ page.url }}"  onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
            title="Share on Twitter" ><img src="/assets/icons/twitter.png" alt="Twitter" width="25" height="25"></a>
   </li>
     <li class="fb">
         <a rel="nofollow" href="https://facebook.com/sharer.php?u=https%3A%2F%2Fwww.scienceofgifts.com/{{ page.url | remove:'/' }}/"  onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
            title="Share on Facebook" ><img src="/assets/icons/facebook.png" alt="Facebook" width="25" height="25"></a>
   </li>

</ul>
</div>
