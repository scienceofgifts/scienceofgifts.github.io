<head lang="en">
    {% include analytics.html %}
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include list-post-css.html %}
  <title>{% if page.search-title %}{{ page.search-title }}{% else %}{{ page.title }}{% endif %}</title>
  <link rel="preconnect" href="https://www.scienceofgifts.com">
  <link rel="stylesheet" href="/css/gift-guide.css">
  <noscript><link rel="stylesheet" href="{{ "/css/list.css" | prepend: site.baseurl }}"></noscript>
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
  <meta content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" name="description">
   <link rel='icon' href='/favicon.ico' type='image/x-icon'/>
  {% include font.html %}
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ site.url }}/assets/{{ page.url | remove:'/' }}.jpg">
  {% if page.schema-image == true %}
  <meta name="robots" content="max-image-preview:large">
  {% endif %}
  <link rel="preload" href="/assets/fonts/sen-v2-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
{% if page.canonical_url %}
<link rel="canonical" href="{{ page.canonical_url }}" />
{% else %}
<link rel="canonical" href="{{ page.url | absolute_url }}" />
{% endif %}
    <!-- JSON-LD markup generated by Google Structured Data Markup Helper. -->
<script type="application/ld+json">
{
  "@context": "http://schema.org",
  "@type": ["Article", "ItemList"],
  "headline": "{{ page.title }}",
  "description": "{{ page. excerpt }}",
  "author": {
    "@type": "Person",
    "name": "Dattaraj Pai",
    "url": "{{ site.url }}/about/"
  },
 "datePublished": "{{ page.date | date_to_xmlschema }}",
"dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "image": "{% if page.schema-image == true %}{{ site.url }}/assets/{{ page.url | remove: '/' }}-large.jpg{% else %}{{ site.url }}/assets/{{ page.url | remove: '/' }}.jpg{% endif %}",
  "url": "{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}",
  "itemListElement": [{% for list in page.lists %}"{{list}}",{% endfor %}"{{page.last-item}}"],
  "publisher": {
    "@type": "Organization",
    "name": "Science of Gifts"
  }
}
</script>
  <script language="javascript">
  
function myFunction() {
    var x = document.getElementById("myTopnav");
    if (x.className === "topnav") {
        x.className += " responsive";
    } else {
        x.className = "topnav";
    }
} 
</script>

<script>
function myScript() {
  var x = document.getElementById("mySecondnav");
  if (x.className === "second-nav") {
    x.className += " responsive";
  } else {
    x.className = "second-nav";
  }
}
</script>
</head>
