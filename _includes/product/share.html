<div class="product-share">
<ul class="product-share-buttons">
   <li class="tw">
        <a rel="nofollow" href="https://twitter.com/intent/tweet?text={{ page.title }}&amp;url={{ site.url }}{{ page.url }}"  onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
            title="Share on Twitter" ><img src="/assets/icons/twitter.png" alt="Twitter"></a>
   </li>
     <li class="fb">
         <a rel="nofollow" href="https://facebook.com/sharer.php?u=http%3A%2F%2Fwww.scienceofgifts.com/gifts/{{ page.img }}/"  onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
            title="Share on Facebook" ><img src="/assets/icons/facebook.png" alt="Facebook"></a>
   </li>
</ul>
</div>
