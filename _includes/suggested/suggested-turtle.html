
<div class="suggestedPost">


<h4 class="suggested">Suggested</h4>

<div class="suggested-list">
  {% assign sorted-posts = site.posts | where: "tags","turtle" %}
{% for post in sorted-posts limit: 50 %}
<a href="{{ post.url }}">
<img width="20%" src="/assets/{{ post.url | remove:'/' }}-thumb.jpg" loading="lazy" width="120" height="90" alt="Pandas">
<h2>{{ post.title }}</h2></a>
 <p>{{post.excerpt | truncate: 110 }}</p>
 <br>

{% endfor %}
</div>

 
 </div>
